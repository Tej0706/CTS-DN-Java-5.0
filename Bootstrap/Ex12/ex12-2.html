<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center text-success mb-5">

    </h2>

    <div class="row g-4">

        <!-- Basic -->
        <div class="col-md-4">
            <div class="card shadow p-4 text-center h-100">

                <h3 class="mb-3">
                    Basic
                </h3>

                <h1 class="text-primary mb-3">
                    ₹299
                </h1>

                <p class="mb-2">

                    Standard
                </h3>

                <h1 class="text-success mb-3">
                    ₹599
                </h1>

                    15 Projects
                </p>

                    Priority Support
                </p>

                <p class="mb-4">
                    Advanced Features
                </p>

                <button class="btn btn-success">
                    Choose Plan
                </button>

            </div>
        </div>

        <!-- Premium -->
        <div class="col-md-4">
            <div class="card shadow p-4 text-center h-100">

                <h3 class="mb-3">
                    Premium
                </h3>

                <h1 class="text-danger mb-3">
                    ₹999
                </h1>

                <p class="mb-2">
                    Unlimited Projects
                </p>

                <p class="mb-2">
                    24/7 Support
                </p>

                <p class="mb-4">
                    Premium Features
                </p>

                    Choose Plan
                </button>

            </div>
        </div>

    </div>
