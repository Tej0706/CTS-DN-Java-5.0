<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 8.2</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width:450px;">

        <h2 class="text-center text-success mb-4">
            Login Form
        </h2>

        <form>

            <!-- Email -->
            <div class="form-floating mb-3">

                <input type="email"
                       class="form-control"
                       id="email"
                       placeholder="Email">

                <label for="email">
                    Email Address
                </label>

            </div>

            <!-- Password -->
            <div class="form-floating mb-3">

                <input type="password"
                       class="form-control"
                       id="password"
                       placeholder="Password">

                <label for="password">
                    Password
                </label>

            </div>

            <button class="btn btn-success w-100">
                Login
            </button>

        </form>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
