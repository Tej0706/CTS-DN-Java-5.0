<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 8.1</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width:600px;">

        <h2 class="text-center text-primary mb-4">
            Registration Form
        </h2>

        <form>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text"
                       class="form-control"
                       placeholder="Enter your name">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>

                <div class="input-group">
                    <span class="input-group-text">@</span>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter email">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>

                <input type="password"
                       class="form-control"
                       placeholder="Enter password">
            </div>

            <!-- Checkbox -->
            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="checkbox">

                <label class="form-check-label">
                    I agree to terms and conditions
                </label>
            </div>

            <button class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
