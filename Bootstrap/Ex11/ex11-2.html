<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Media Object Layout
    </h2>

    <div class="card shadow p-3">

        <div class="d-flex align-items-start">

            <!-- Left Image -->
            <img src="profile.jpg"
                 width="120"
                 class="rounded me-3"
                 alt="Image">

            <!-- Right Content -->
            <div>

                <h4>
                    Media Heading
                </h4>

                <p class="text-muted">
                    Image aligned to the left
                </p>

                <p>
                    This layout demonstrates a media object
                    style design using Bootstrap flex utilities.
                    The image stays on the left while text
                    appears on the right.
                </p>

            </div>

        </div>

    </div>

</div>
