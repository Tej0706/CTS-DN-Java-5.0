<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 18.1</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">

    <h2 class="text-primary mb-4">
        Bootstrap Modal Demo
    </h2>

    <!-- Trigger Button -->
    <button class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#myModal">

        Open Modal

    </button>

</div>

<!-- Modal -->
<div class="modal fade"
     id="myModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <!-- Header -->
            <div class="modal-header">

                <h5 class="modal-title">
                    Welcome
                </h5>

                <button class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <!-- Body -->
            <div class="modal-body">

                This is a Bootstrap modal popup.

            </div>

            <!-- Footer -->
            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
