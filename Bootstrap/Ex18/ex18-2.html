<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 18.2</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Accordion Demo
    </h2>

    <div class="accordion"
         id="accordionExample">

        <!-- Item 1 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseOne">

                    Section 1

                </button>

            </h2>

            <div id="collapseOne"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#accordionExample">

                <div class="accordion-body">

                    Content for section 1.

                </div>

            </div>

        </div>

        <!-- Item 2 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo">

                    Section 2

                </button>

            </h2>

            <div id="collapseTwo"
                 class="accordion-collapse collapse"
                 data-bs-parent="#accordionExample">

                <div class="accordion-body">

                    Content for section 2.

                </div>

            </div>

        </div>

        <!-- Item 3 -->
        <div class="accordion-item">

            <h2 class="accordion-header">

                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseThree">

                    Section 3

                </button>

            </h2>

            <div id="collapseThree"
                 class="accordion-collapse collapse"
                 data-bs-parent="#accordionExample">

                <div class="accordion-body">

                    Content for section 3.

                </div>

            </div>

        </div>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
