<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 9.2</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-success mb-4">
            Button Groups and Toggle Buttons
        </h2>

        <!-- Button Group -->
        <h4 class="mb-3">
            Button Group
        </h4>

        <div class="btn-group mb-4">

            <button class="btn btn-light">
                Left
            </button>

            <button class="btn btn-primary">
                Middle
            </button>

            <button class="btn btn-light">
                Right
            </button>

        </div>

        <!-- Toggle Buttons -->
        <h4 class="mb-3">
            Toggle Buttons
        </h4>

        <div class="btn-group" role="group">

            <input type="checkbox"
                   class="btn-check"
                   id="check1"
                   autocomplete="off">

            <label class="btn btn-outline-primary"
                   for="check1">
                HTML
            </label>

            <input type="checkbox"
                   class="btn-check"
                   id="check2"
                   autocomplete="off">

            <label class="btn btn-outline-success"
                   for="check2">
                CSS
            </label>

            <input type="checkbox"
                   class="btn-check"
                   id="check3"
                   autocomplete="off">

            <label class="btn btn-outline-danger"
                   for="check3">
                JavaScript
            </label>

        </div>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
