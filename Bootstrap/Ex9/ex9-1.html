<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 9.1</title>

<link rel="stylesheet" href="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\css\bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary mb-4">
            Bootstrap Buttons
        </h2>

        <!-- Contextual Buttons -->
        <div class="mb-4">

            <button class="btn btn-primary m-1">Primary</button>

            <button class="btn btn-secondary m-1">Secondary</button>

            <button class="btn btn-success m-1">Success</button>

            <button class="btn btn-danger m-1">Danger</button>

            <button class="btn btn-warning m-1">Warning</button>

            <button class="btn btn-info m-1">Info</button>

            <button class="btn btn-light m-1">Light</button>

            <button class="btn btn-dark m-1">Dark</button>

        </div>

        <!-- Outline Buttons -->
        <h4 class="mb-3">
            Outline Buttons
        </h4>

        <div>

            <button class="btn btn-outline-primary m-1">
                Outline Primary
            </button>

            <button class="btn btn-outline-success m-1">
                Outline Success
            </button>

            <button class="btn btn-outline-danger m-1">
                Outline Danger
            </button>

            <button class="btn btn-outline-dark m-1">
                Outline Dark
            </button>

        </div>

    </div>

</div>

<script src="D:\CTS Exercises\Bootstrap\bootstrap-5.3.8-dist\bootstrap-5.3.8-dist\js\bootstrap.bundle.min.js"></script>
</body>
</html>
